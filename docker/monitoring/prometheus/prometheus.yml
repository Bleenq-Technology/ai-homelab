global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Traefik internal metrics entrypoint (see core/traefik/config/traefik.yml)
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8082']

  - job_name: 'telegraf'
    static_configs:
      - targets: ['telegraf:9273']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']          # jarvis host (container, --path.rootfs=/host)
        labels:
          instance: jarvis
      # heimdall — Samba AD DC #2 / HA replica (192.168.2.2). Native
      # prometheus-node-exporter on the trusted LAN; systemd collector exports
      # samba-ad-dc unit health.
      - targets: ['192.168.2.2:9100']
        labels:
          instance: heimdall
      # mimir — Samba AD DC #1 / PRIMARY, holds all FSMO (192.168.2.4). Same
      # native node_exporter + systemd collector as heimdall.
      - targets: ['192.168.2.4:9100']
        labels:
          instance: mimir
      # hoenir — Samba AD DC #2 / HA replica, Raspberry Pi 5 arm64 (192.168.2.5).
      # Permanent replacement for heimdall. Same native node_exporter + systemd collector.
      - targets: ['192.168.2.5:9100']
        labels:
          instance: hoenir
      # stor — Asustor NAS (192.168.2.11). Containerized node-exporter (ADM is
      # busybox); mdadm (RAID5 md1) + btrfs (/volume1) collectors included.
      - targets: ['192.168.2.11:9100']
        labels:
          instance: stor

  # zoomie — Paul's Windows workstation (Telegraf prometheus_client on :9273).
  # External LAN host on 192.168.1.0/24, reached cross-subnet via the EdgeRouter
  # (Prometheus egresses as the jarvis host IP 192.168.2.10). Captures CPU/mem/disk +
  # RTX 5070 Ti GPU power/temp; up==0 marks the workstation's frequent reboots.
  - job_name: 'zoomie'
    static_configs:
      - targets: ['192.168.1.10:9273']
    metric_relabel_configs:
      # nvidia_smi attaches volatile labels (pstate flips every scrape) that churn
      # the GPU time series and break graph continuity — drop the noisy ones.
      - regex: 'pstate|display_mode|display_active|compute_mode|vbios_version|serial'
        action: labeldrop

  - job_name: 'nvidia-gpu'
    static_configs:
      - targets: ['nvidia-gpu-exporter:9835']
        labels:
          instance: jarvis

  # Drive SMART health / wear / temperature (NVMe 990 PRO + SATA 870 EVO)
  - job_name: 'smartctl'
    static_configs:
      - targets: ['smartctl-exporter:9633']      # jarvis drives
        labels:
          instance: jarvis
      # heimdall SSD (PNY CS900 SATA) — same exporter v0.14.0, native on the DC.
      - targets: ['192.168.2.2:9633']
        labels:
          instance: heimdall
      # mimir SSD (Samsung 870 EVO SATA) — same exporter v0.14.0, native on the DC.
      - targets: ['192.168.2.4:9633']
        labels:
          instance: mimir
      # hoenir NVMe (Samsung 256 GB) — same exporter v0.14.0, native arm64 on the Pi DC.
      - targets: ['192.168.2.5:9633']
        labels:
          instance: hoenir
      # stor — 3× NVMe (RAID5). Same exporter v0.14.0, containerized.
      - targets: ['192.168.2.11:9633']
        labels:
          instance: stor

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # QuestDB operational metrics (ingest/query/health — NOT the market data itself)
  - job_name: 'questdb'
    static_configs:
      - targets: ['questdb:9003']

  # ClickHouse native Prometheus endpoint (replaces the removed clickhouse-exporter)
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:9363']

  # MinIO exposes cluster metrics without a bearer token because the service sets
  # MINIO_PROMETHEUS_AUTH_TYPE=public (see data/compose.data.yml).
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']

  # Redpanda broker — curated public metrics on the admin port (9644). NOT the
  # market/event data itself; throughput, partitions, disk, consumer-group offsets.
  # Consumer-group LAG is computed in PromQL (max_offset - committed_offset) — see
  # the Redpanda Grafana dashboard; Redpanda exposes the two offsets, not lag directly.
  - job_name: 'redpanda'
    metrics_path: /public_metrics
    static_configs:
      - targets: ['redpanda:9644']

  - job_name: 'adguard-exporter'
    static_configs:
      - targets: ['adguard-exporter:9617']

  # NOTE: 'clickhouse-exporter' and 'watchtower' scrape jobs removed — the
  # clickhouse-exporter container is gone (unmaintained image; see compose), and
  # watchtower doesn't expose a metrics endpoint here (no HTTP API token wired).
  # Both were permanently up==0 and fired false InstanceDown alerts.

  - job_name: 'keycloak'
    metrics_path: /metrics
    static_configs:
      - targets: ['keycloak:9000']

  # Endpoint reachability via Blackbox (HTTPS through Traefik)
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://traefik.lab.example
          - https://grafana.lab.example
          - https://keycloak.lab.example
          - https://portainer.lab.example
          - https://minio.lab.example
          - https://openwebui.lab.example
          - https://n8n.lab.example
          - https://langfuse.lab.example
          - https://uptime.lab.example
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # AD DC port reachability (TCP connect) for BOTH DCs. A failed KDC/LDAP probe
  # here is exactly the boot-bind class of fault that broke Kerberos after the
  # hardware migration — this catches it. `svc`/`host` labels drive the generic
  # AD Domain Controller dashboard (host dropdown) + the blackbox-ad alerts.
  - job_name: 'blackbox-ad'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      # heimdall (DC#2 / replica)
      - targets: ['192.168.2.2:53']
        labels: { svc: dns, host: heimdall }
      - targets: ['192.168.2.2:88']
        labels: { svc: kerberos-kdc, host: heimdall }
      - targets: ['192.168.2.2:389']
        labels: { svc: ldap, host: heimdall }
      - targets: ['192.168.2.2:464']
        labels: { svc: kpasswd, host: heimdall }
      - targets: ['192.168.2.2:636']
        labels: { svc: ldaps, host: heimdall }
      - targets: ['192.168.2.2:3268']
        labels: { svc: global-catalog, host: heimdall }
      # mimir (DC#1 / PRIMARY, holds FSMO)
      - targets: ['192.168.2.4:53']
        labels: { svc: dns, host: mimir }
      - targets: ['192.168.2.4:88']
        labels: { svc: kerberos-kdc, host: mimir }
      - targets: ['192.168.2.4:389']
        labels: { svc: ldap, host: mimir }
      - targets: ['192.168.2.4:464']
        labels: { svc: kpasswd, host: mimir }
      - targets: ['192.168.2.4:636']
        labels: { svc: ldaps, host: mimir }
      - targets: ['192.168.2.4:3268']
        labels: { svc: global-catalog, host: mimir }
      # hoenir (DC#2 / HA replica, Pi5 — heimdall's replacement)
      - targets: ['192.168.2.5:53']
        labels: { svc: dns, host: hoenir }
      - targets: ['192.168.2.5:88']
        labels: { svc: kerberos-kdc, host: hoenir }
      - targets: ['192.168.2.5:389']
        labels: { svc: ldap, host: hoenir }
      - targets: ['192.168.2.5:464']
        labels: { svc: kpasswd, host: hoenir }
      - targets: ['192.168.2.5:636']
        labels: { svc: ldaps, host: hoenir }
      - targets: ['192.168.2.5:3268']
        labels: { svc: global-catalog, host: hoenir }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # stor NAS core service reachability (SMB file sharing + the restic rest-server
  # that heimdall & jarvis back up to). probe_success==0 -> NASServiceDown alert.
  - job_name: 'blackbox-stor'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ['192.168.2.11:445']
        labels: { svc: smb }
      - targets: ['192.168.2.11:28000']
        labels: { svc: restic-rest }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
