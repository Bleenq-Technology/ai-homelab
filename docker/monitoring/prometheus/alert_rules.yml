# Prometheus alerting rules for the jarvis homelab.
# Routed to Discord via Alertmanager (see ../alertmanager/config.yml).
# Thresholds are deliberately conservative/high-signal — tune in git, then
# `curl -X POST https://prometheus.../-/reload` (or restart the container).
#
# Metric-name notes (verified against the live TSDB, 2026-06-16):
#   - GPU temp:   nvidia_smi_temperature_gpu          (utkuozdemir/nvidia_gpu_exporter)
#   - CPU temp:   node_hwmon_temp_celsius{chip=~"pci.*18_3"}  -> AMD k10temp ONLY.
#                 (node_hwmon also exposes the NVMe SSD and a flaky WMI chip that
#                  reports a bogus 216 C — both are excluded by the chip match.)
#   - Containers: docker_container_status_{oomkilled,restart_count}  (telegraf docker input)
#   - Redis maxmemory is 0 (unbounded), so Redis is alerted on absolute bytes.
#   - Drive SMART: smartctl_device_* (smartctl-exporter v0.14.0). VERIFIED live
#     2026-06-24: percentage_used/available_spare are 0-100 (not 0-1); device
#     labels are bare "nvme0"/"sda" (NOT "/dev/..." as the exporter's EXAMPLE.md
#     shows). NVMe-only fields (percentage_used, available_spare, bytes_written)
#     are absent for sda, so wear/spare alerts scope to device=~"nvme.*".
groups:

  # ---- Up / reachability --------------------------------------------------
  - name: instance-health
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.job }} ({{ $labels.instance }}) is down"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} (job {{ $labels.job }}) for over 2 minutes."

  - name: edge-health
    rules:
      - alert: TraefikDown
        expr: up{job="traefik"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Traefik is down"
          description: "The Traefik reverse proxy metrics endpoint is unreachable — web routing is likely affected."

      - alert: EndpointDown
        expr: probe_success{job="blackbox"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint {{ $labels.instance }} is failing its HTTPS probe"
          description: "Blackbox exporter reports {{ $labels.instance }} has not returned a healthy response for 2 minutes."

  # ---- Active Directory (mimir = PRIMARY/FSMO, heimdall = DC#2/replica) ----
  # Rules are instance-agnostic and fire per-DC; both DCs are scraped.
  - name: active-directory
    rules:
      # Cleanest DC-down signal: the samba-ad-dc systemd unit isn't active.
      - alert: ADDomainControllerDown
        expr: node_systemd_unit_state{name="samba-ad-dc.service",state="active"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Samba AD DC (samba-ad-dc) is not active on {{ $labels.instance }}"
          description: "This DC's samba-ad-dc has been non-active for 2 minutes. With two DCs the other still serves Kerberos/LDAP/DNS, but redundancy is lost — if this is mimir (FSMO holder), restore it promptly or seize roles onto heimdall."

      # Per-port reachability. Catches the boot-bind failure class where the unit
      # is 'active' but the KDC (88) never bound — Kerberos down while LDAPS stays up.
      - alert: ADServicePortDown
        expr: probe_success{job="blackbox-ad"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} AD port for {{ $labels.svc }} is not answering"
          description: "TCP probe to {{ $labels.host }}'s {{ $labels.svc }} port has failed for 2 minutes. If samba-ad-dc shows active, this is the KDC-rebind class — restart samba-ad-dc on {{ $labels.host }}."

  # ---- Temperatures (top priority: GPU + CPU) -----------------------------
  - name: temperatures
    rules:
      - alert: GPUTempHigh
        expr: nvidia_smi_temperature_gpu > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU temperature high on {{ $labels.instance }} ({{ $value | printf \"%.0f\" }} C)"
          description: "RTX 3090 has been above 80 C for 5 minutes (throttles around 83 C). Check airflow / sustained load."

      - alert: GPUTempCritical
        expr: nvidia_smi_temperature_gpu > 87
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "GPU temperature CRITICAL on {{ $labels.instance }} ({{ $value | printf \"%.0f\" }} C)"
          description: "RTX 3090 has been above 87 C for 2 minutes — sustained throttling / thermal risk. Investigate cooling now."

      - alert: CPUTempHigh
        expr: max by (instance) (node_hwmon_temp_celsius{chip=~"pci.*18_3"}) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU temperature high on {{ $labels.instance }} ({{ $value | printf \"%.0f\" }} C)"
          description: "AMD CPU (k10temp) has been above 80 C for 5 minutes. Check cooling / sustained load."

      - alert: CPUTempCritical
        expr: max by (instance) (node_hwmon_temp_celsius{chip=~"pci.*18_3"}) > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CPU temperature CRITICAL on {{ $labels.instance }} ({{ $value | printf \"%.0f\" }} C)"
          description: "AMD CPU (k10temp) has been above 90 C for 2 minutes — approaching thermal throttle. Investigate now."

  # ---- Disk ---------------------------------------------------------------
  - name: disk
    rules:
      - alert: DiskSpaceLow
        expr: 100 - (node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"} * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} over 80% full ({{ $value | printf \"%.0f\" }}%)"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.device }} has been over 80% full for 10 minutes. Free space or it will fill."

      - alert: DiskSpaceCritical
        expr: 100 - (node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"} * 100) > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} over 90% full ({{ $value | printf \"%.0f\" }}%)"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.device }} is over 90% full — imminent out-of-space. Clean up now (you hit 90% once before)."

  # ---- mdadm RAID + NAS services (stor) -----------------------------------
  - name: storage-raid
    rules:
      # Alert on actually-failed member disks, NOT node_md_degraded: Asustor
      # over-provisions the SYSTEM RAID1 arrays (md0 [6/3], md126 [4/3]) across
      # all bays, so they report permanently "degraded" while healthy. Failed-disk
      # count is the true signal (0 on those). Covers the data array md1 (RAID5).
      - alert: RAIDArrayDiskFailed
        expr: node_md_disks{state="failed"} > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "RAID array {{ $labels.device }} on {{ $labels.instance }} has {{ $value | printf \"%.0f\" }} failed disk(s)"
          description: "An mdadm array reports a failed member — redundancy is reduced. Check the array and replace the drive."

      - alert: NASServiceDown
        expr: probe_success{job="blackbox-stor"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "stor service {{ $labels.svc }} ({{ $labels.instance }}) is not answering"
          description: "TCP probe to stor's {{ $labels.svc }} port has failed for 2 minutes. SMB shares / the restic backup target may be unavailable."

  # ---- Drive SMART health / wear / temperature (smartctl-exporter) --------
  # NVMe-only metrics (percentage_used, available_spare) are absent for the SATA
  # drive, so wear/spare alerts are scoped to device=~"nvme.*". smartctl device
  # labels are bare "nvme0" / "sda" (NOT the node_disk nvme0n1/sda, NOT /dev/*).
  - name: disk-smart
    rules:
      - alert: DriveSMARTFailing
        expr: smartctl_device_smart_status == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SMART overall-health FAILED on {{ $labels.device }} ({{ $labels.instance }})"
          description: "smartctl reports the SMART self-assessment FAILED for {{ $labels.device }} — the drive is predicting its own failure. Back up and replace it."

      - alert: NVMeWearHigh
        expr: smartctl_device_percentage_used{device=~"nvme.*"} > 80
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} on {{ $labels.instance }} at {{ $value | printf \"%.0f\" }}% of rated life"
          description: "NVMe endurance used has exceeded 80% on {{ $labels.device }}. Plan a replacement before it reaches 100% (this is the wear signal we lacked when the old 256G drive aged out)."

      - alert: NVMeSpareLow
        expr: smartctl_device_available_spare{device=~"nvme.*"} < 10
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} on {{ $labels.instance }} available spare critically low ({{ $value | printf \"%.0f\" }}%)"
          description: "NVMe reserved spare blocks below 10% on {{ $labels.device }} — failure is imminent. Replace now."

      - alert: DriveMediaErrors
        expr: smartctl_device_media_errors > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} on {{ $labels.instance }} reported {{ $value | printf \"%.0f\" }} media/integrity errors"
          description: "smartctl logged media errors on {{ $labels.device }} — uncorrected data-integrity events. Investigate; this often precedes failure."

      - alert: DriveTempHigh
        expr: smartctl_device_temperature{temperature_type="current"} > 70
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Drive {{ $labels.device }} on {{ $labels.instance }} temperature high ({{ $value | printf \"%.0f\" }} C)"
          description: "{{ $labels.device }} has been above 70 C for 10 minutes (the nvme sits in the 3090's airflow path). Check cooling / sustained write load."

      - alert: DriveTempCritical
        expr: smartctl_device_temperature{temperature_type="current"} > 80
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Drive {{ $labels.device }} on {{ $labels.instance }} temperature CRITICAL ({{ $value | printf \"%.0f\" }} C)"
          description: "{{ $labels.device }} above 80 C — thermal-throttle / wear-acceleration territory. Investigate cooling now (heat-related NVMe death is the failure mode we're guarding against)."

  # ---- Host memory pressure (ties into OOM risk) --------------------------
  # Host-scoped thresholds: real servers (jarvis, heimdall) warn at <10% available,
  # but stor is a small 3.8 GB Asustor NAS appliance that runs structurally near-full
  # under ADM + its Docker apps (~1-2% available is its NORMAL baseline, not
  # actionable), so it gets a far looser, longer-window floor of its own.
  - name: memory-pressure
    rules:
      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes{instance!="stor"} / node_memory_MemTotal_bytes{instance!="stor"} * 100 < 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory low on {{ $labels.instance }} ({{ $value | printf \"%.0f\" }}% available)"
          description: "{{ $labels.instance }}: less than 10% of host RAM has been available for 10 minutes — OOM-kill risk rising."

      # stor runs structurally near-full on RAM (0.6-5% available is its NORMAL
      # baseline), so a MemAvailable% threshold just flaps. The real "NAS is out of
      # memory" signal is swap exhaustion — it already spills to swap in normal
      # operation, so alert only when swap headroom itself collapses.
      - alert: NASMemoryLow
        expr: node_memory_SwapFree_bytes{instance="stor"} / node_memory_SwapTotal_bytes{instance="stor"} * 100 < 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "NAS memory low on {{ $labels.instance }} (swap {{ $value | printf \"%.0f\" }}% free)"
          description: "{{ $labels.instance }} (small NAS appliance): swap free under 10% for 15 minutes — it has spilled to swap and swap is nearly exhausted (RAM available runs ~1% normally, so swap headroom is the real OOM signal). Check ADM / its Docker apps."

  # ---- Containers: OOM kills + restart loops ------------------------------
  - name: containers
    rules:
      - alert: ContainerOOMKilled
        expr: docker_container_status_oomkilled == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.container_name }} was OOM-killed"
          description: "{{ $labels.container_name }} has its OOMKilled flag set — the kernel killed it for exceeding memory. Raise its limit or fix the leak."

      - alert: ContainerRestarting
        expr: increase(docker_container_status_restart_count[1h]) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.container_name }} is restart-looping"
          description: "{{ $labels.container_name }} has restarted 3+ times in the last hour — likely crash-looping. Check its logs."

  # ---- Postgres -----------------------------------------------------------
  - name: postgres
    rules:
      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres connections over 80% of max"
          description: "Active connections have been above 80% of max_connections ({{ with query \"max(pg_settings_max_connections)\" }}{{ . | first | value | printf \"%.0f\" }}{{ end }}) for 5 minutes. Connection leak or pool too large?"

  # ---- Redis (maxmemory unbounded -> absolute thresholds) -----------------
  - name: redis
    rules:
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes > 2e9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis using over 2 GB ({{ $value | humanize1024 }}B)"
          description: "Redis memory has exceeded 2 GB for 10 minutes. maxmemory is unset (unbounded) — consider setting maxmemory + an eviction policy."

      - alert: RedisMemoryCritical
        expr: redis_memory_used_bytes > 4e9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redis using over 4 GB ({{ $value | humanize1024 }}B)"
          description: "Redis memory has exceeded 4 GB — unbounded growth risks host OOM. Set maxmemory and investigate what is filling it."

  # ---- Redpanda (event/streaming spine) -----------------------------------
  # Metric names verified live on /public_metrics (2026-06-25). Lag is NOT a
  # direct metric — Redpanda exposes redpanda_kafka_max_offset and
  # redpanda_kafka_consumer_group_committed_offset; lag is their difference,
  # and only exists once a consumer group has committed offsets.
  - name: redpanda
    rules:
      - alert: RedpandaUnavailablePartitions
        expr: redpanda_cluster_unavailable_partitions > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redpanda has {{ $value | printf \"%.0f\" }} unavailable partition(s)"
          description: "One or more partitions have no leader for 2 minutes — producers/consumers on those topics stall. Check the redpanda container/logs."

      - alert: RedpandaDiskSpaceAlert
        expr: redpanda_storage_disk_free_space_alert > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redpanda is in a low-disk state on the spine volume"
          description: "Redpanda has raised its own disk-space alert (free space below its threshold) — it throttles/blocks writes in this state. Free space on /srv/ai-data or shorten topic retention."

      - alert: RedpandaConsumerGroupLagHigh
        expr: |
          sum by (redpanda_group, redpanda_topic) (
            redpanda_kafka_max_offset{redpanda_namespace="kafka"}
            - on (redpanda_topic, redpanda_partition) group_right()
            redpanda_kafka_consumer_group_committed_offset
          ) > 100000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Consumer group {{ $labels.redpanda_group }} lag high on {{ $labels.redpanda_topic }} ({{ $value | printf \"%.0f\" }})"
          description: "A consumer group has been more than 100k messages behind on a topic for 15 minutes — a sink (e.g. the QuestDB sink) is not keeping up with ingestion. Check the consumer."

  # ---- ClickHouse ---------------------------------------------------------
  # Capacity tripwires for the `scanner` research store (todos.md #25). `/srv/ai-data`
  # is 1.8 T, so the generic DiskSpaceLow (>80%) would only fire after ~1.4 T — far too
  # late to be a useful signal about one database. These watch ClickHouse's own data
  # instead. TotalBytesOfMergeTreeTables is all databases; the ...System variant is
  # ClickHouse's internal log tables, so the difference is real user data (Langfuse +
  # scanner), and scanner dominates it.
  - name: clickhouse
    rules:
      - alert: ClickHouseUserDataLarge
        expr: |
          ClickHouseAsyncMetrics_TotalBytesOfMergeTreeTables
          - ClickHouseAsyncMetrics_TotalBytesOfMergeTreeTablesSystem > 300e9
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "ClickHouse user data over 300 GB ({{ $value | humanize1024 }}B)"
          description: "Mostly the `scanner` research DB (trades tape backfill). Not urgent — /srv/ai-data is 1.8 T — but this is the agreed point to revisit retention: apply a TTL or drop old monthly partitions. See docker/data/clickhouse/README.md."

      - alert: ClickHouseSystemLogsBloated
        expr: ClickHouseAsyncMetrics_TotalBytesOfMergeTreeTablesSystem > 20e9
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "ClickHouse system log tables over 20 GB ({{ $value | humanize1024 }}B)"
          description: "The system.*_log TTLs in config.d/logs-ttl.xml are not taking effect (they once grew to 5.65 GiB unbounded, 97% of ClickHouse's footprint). Check that the config is mounted and that TTL merges are running."

  # ---- Backups ------------------------------------------------------------
  # Fed by backup.sh via node-exporter's textfile collector. The gap this closes: on
  # 2026-07-04 jarvis was powered off at 02:00, so the nightly never ran — and a run that
  # never happened is indistinguishable from a healthy one unless something watches the
  # clock. `absent()` covers the case where the metric file was never written at all
  # (cron removed, script moved, textfile dir gone).
  - name: backup
    rules:
      - alert: BackupStale
        expr: time() - homelab_backup_last_success_timestamp_seconds > 30 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No fully-successful homelab backup in over 30h"
          description: "backup.sh last completed with every component OK more than 30 hours ago (nightly runs at 02:00). Check /srv/ai-data/backups/backup.log — and whether jarvis was powered off."

      - alert: BackupVeryStale
        expr: time() - homelab_backup_last_success_timestamp_seconds > 50 * 3600
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "No fully-successful homelab backup in over 50h"
          description: "Two nightly windows have passed without a clean backup. The off-host restic copy to the NAS is also stale — this is the DR copy. Investigate now."

      - alert: BackupMetricsMissing
        expr: absent(homelab_backup_last_success_timestamp_seconds)
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "Backup metrics absent — backup.sh may not be running at all"
          description: "node-exporter is not exposing homelab_backup_* from its textfile collector. Either backup.sh never ran since this alert was added, its cron entry is gone, or /var/lib/node_exporter/textfile is missing."

      - alert: BackupComponentFailed
        expr: homelab_backup_component_success == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backup component {{ $labels.component }} failed on the last run"
          description: "backup.sh completed but the {{ $labels.component }} datastore did not back up. Other components may be fine. See /srv/ai-data/backups/backup.log."

  # Restore-SIDE verification (verify-backups.sh, weekly Sun 03:00). The backup group
  # above is write-side "did it run"; this group is "did the archive actually contain
  # restorable data" — the class of failure that hid an empty QuestDB / stale MinIO
  # backup while every write-side check passed (2026-07-18). See docs/off-host-backup.md.
  - name: backup-verify
    rules:
      - alert: BackupVerifyStale
        expr: time() - homelab_backup_verify_last_success_timestamp_seconds > 8.5 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No fully-successful backup VERIFICATION in over 8.5 days"
          description: "verify-backups.sh (weekly, Sun 03:00) has not passed every restore-side content check in over a week. A backup that reports success can still be empty/stale — this is the check that catches that. See /srv/ai-data/backups/verify.log."

      - alert: BackupVerifyFailed
        expr: homelab_backup_verify_success == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backup verification failed for {{ $labels.component }}"
          description: "verify-backups.sh opened the newest {{ $labels.component }} archive and its content assertion FAILED (corrupt, empty, or wrong-source). For offhost this is a restore round-trip / SHA256 mismatch. See /srv/ai-data/backups/verify.log."

      - alert: BackupVerifyMetricsMissing
        expr: absent(homelab_backup_verify_last_success_timestamp_seconds)
        for: 8d
        labels:
          severity: warning
        annotations:
          summary: "Backup-verify metrics absent — verify-backups.sh may not be running"
          description: "node-exporter is not exposing homelab_backup_verify_* from its textfile collector. Either the weekly verify cron is gone, or the textfile dir is unwritable. See docs/off-host-backup.md."

  # AI governance drift (docs/ai-governance.md, todos.md #36). The AI-BOM check
  # joins docs/ai-inventory.yml against live platform state; a disagreement means
  # either an ungoverned system appeared or an approved one drifted out of its
  # control-matrix requirements. Same three-alert shape as backup-verify above:
  # the finding, the staleness, and the dead-man — because a governance check that
  # stops running silently is worse than one that never existed.
  - name: ai-governance
    rules:
      - alert: AiBomDriftDetected
        expr: homelab_ai_bom_drift_failures > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "AI governance drift — {{ $value }} failing check(s)"
          description: "The weekly AI-BOM check found inventory and reality disagree: an unregistered LiteLLM key (shadow AI), a stale inventory entry, a missing owner/tier, a control-matrix violation (budget/rate-limit/expiry/oversight), or traces from an unknown system. Run: python3 /opt/homelab/ai/inventory/build-ai-bom.py --live --check. See /srv/ai-data/backups/ai-bom.log and docs/ai-governance.md."

      - alert: AiBomCheckStale
        expr: time() - homelab_ai_bom_last_run_timestamp_seconds > 8.5 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No AI-BOM governance check in over 8.5 days"
          description: "The weekly check (Sun 03:30) has not completed in over a week. The inventory is the control point every other AI governance item depends on — while this is stale, an unregistered system would not be noticed."

      - alert: AiBomMetricsMissing
        expr: absent(homelab_ai_bom_last_run_timestamp_seconds)
        for: 8d
        labels:
          severity: warning
        annotations:
          summary: "AI-BOM metrics absent — the governance check may not be running"
          description: "node-exporter is not exposing homelab_ai_bom_* from its textfile collector. Either the weekly cron is gone or the textfile dir is unwritable (the present-but-unwritable case is the dangerous one — see todos.md #11). Governance is unmonitored until this clears."

  # Shadow-AI egress detection (todos.md #39). NOTE what is deliberately NOT
  # here: an alert on homelab_ai_egress_open_paths > 0. Those paths ARE open
  # today — that is the documented state #39 exists to close — so alerting on it
  # would fire permanently and train us to ignore the whole group. The metric is
  # tracked for the dashboard; once the blocking half of #39 lands and the
  # expected value becomes 0, add:
  #     - alert: AiEgressPathOpen
  #       expr: homelab_ai_egress_open_paths > 0
  # Until then the only useful alert is the dead-man on the check itself.
  - name: ai-egress
    rules:
      - alert: AiEgressCheckStale
        expr: time() - homelab_ai_egress_last_run_timestamp_seconds > 8.5 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No shadow-AI egress check in over 8.5 days"
          description: "check-egress.sh (weekly, Sun 03:40) has not completed in over a week. While stale, a container reaching a public LLM provider outside the gateway would go unnoticed. See docker/ai/inventory/check-egress.sh."

      - alert: AiEgressMetricsMissing
        expr: absent(homelab_ai_egress_last_run_timestamp_seconds)
        for: 8d
        labels:
          severity: warning
        annotations:
          summary: "Shadow-AI egress metrics absent — the check may not be running"
          description: "node-exporter is not exposing homelab_ai_egress_* from its textfile collector. Either the weekly cron is gone or the textfile dir is unwritable (present-but-unwritable is the dangerous case — see todos.md #11)."

  # Container image drift. We pin every image deliberately, which means nothing
  # updates unless a human looks — and on 2026-07-24 nobody had looked in a while
  # (cloudflared 17 months old, minio 15). Pinning without a drift check is a
  # slower way to run old software.
  #
  # NOTE WHAT IS **NOT** ALERTED: `_behind > 0`. Being behind is a decision to
  # make on a schedule, not a page — 30 images are behind right now and that is
  # fine. Alerting on it would be permanently firing, i.e. permanently ignored.
  # What IS alerted: the check going stale, and FLOATING tags, because an unpinned
  # image silently changing under a recreate is a reproducibility bug, not a
  # backlog item.
  - name: image-drift
    rules:
      - alert: ImageDriftCheckStale
        expr: time() - homelab_image_versions_last_run_timestamp_seconds > 8.5 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No container image drift check in over 8.5 days"
          description: "check-image-versions.py (weekly, Mon 16:00 UTC) has not completed in over a week. While stale, an image going years out of date is invisible. See docker/monitoring/version-drift/."

      - alert: ImageTagsFloating
        expr: homelab_image_versions_floating > 0
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} running image(s) are on a floating tag"
          description: "An image pinned to :latest or a major-only tag (e.g. caddy:2-alpine) can change content on any recreate, so the deployed state is not reproducible and a rollback target does not exist. CLAUDE.md requires pinned versions. Run docker/monitoring/version-drift/check-image-versions.py to list them."

      - alert: ImageDriftMetricsMissing
        expr: absent(homelab_image_versions_last_run_timestamp_seconds)
        for: 8d
        labels:
          severity: warning
        annotations:
          summary: "Image drift metrics absent — the check may not be running"
          description: "node-exporter is not exposing homelab_image_versions_* from its textfile collector. Either the weekly cron is gone or the textfile dir is unwritable (present-but-unwritable is the dangerous case — see todos.md #11)."

  # Human oversight of the PUBLIC chat surfaces (todos.md #46). Every T2 public
  # system in ai-inventory.yml names "periodic review of Langfuse traces" as its
  # human_oversight mechanism. Until 2026-07-24 that was the one claim on the
  # posture table with nothing running behind it.
  #
  # NOTE THE SECOND ALERT. A dead-man on the JOB only proves a file was written.
  # The realistic failure of periodic review is not that it stops generating —
  # it is that it keeps generating and nobody reads it. So the ACK is a separate
  # metric with its own alert, and it is the one that makes the oversight real.
  - name: ai-oversight
    rules:
      - alert: AiOversightReviewStale
        expr: time() - homelab_ai_oversight_last_run_timestamp_seconds > 8.5 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No public-surface AI review in over 8.5 days"
          description: "review-public-transcripts.py (weekly, Mon 15:00 UTC) has not completed in over a week. Trace bodies age out at 14 days, so an unreviewed window becomes permanently unreviewable. See docker/ai/oversight/."

      - alert: AiOversightUnacknowledged
        expr: time() - homelab_ai_oversight_ack_timestamp_seconds > 14 * 24 * 3600
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "Public-surface AI reviews are being generated but not read"
          description: "No human has run `review-public-transcripts.py --ack` in 14 days. The inventory claims periodic human review as the oversight control for the public T2 surfaces; unacknowledged reviews mean that claim is currently false. Read the latest in /srv/ai-data/oversight/ and ack it, or change the inventory to stop claiming it."

      - alert: AiOversightMetricsMissing
        expr: absent(homelab_ai_oversight_last_run_timestamp_seconds)
        for: 8d
        labels:
          severity: warning
        annotations:
          summary: "AI oversight metrics absent — the review may not be running"
          description: "node-exporter is not exposing homelab_ai_oversight_* from its textfile collector. Either the weekly cron is gone or the textfile dir is unwritable (present-but-unwritable is the dangerous case — see todos.md #11)."

  # Model-weight integrity + provenance (todos.md #45). We pin image versions
  # rigorously and pinned model weights not at all until 2026-07-22. For bge-m3
  # this matters more than it looks: every kb_* collection is embedded with it,
  # so a changed file silently invalidates the whole KB library while every
  # service keeps starting cleanly.
  - name: ai-model-integrity
    rules:
      - alert: AiModelVerifyFailed
        expr: homelab_ai_model_verify_failures > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Model weight verification FAILED — {{ $value }} file(s) missing or altered"
          description: "A GGUF recorded in docker/ai/models/manifest.json is missing or no longer hashes to its recorded sha256. Treat as a supply-chain event until proven otherwise: a weights file does not change on its own. If the change was intentional, update the manifest and record the new source/revision. See /srv/ai-data/backups/ai-models.log."

      - alert: AiModelUnregistered
        expr: homelab_ai_model_unregistered > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} unregistered model weight file(s) on the host"
          description: "A .gguf larger than 10MB exists on jarvis with no entry in docker/ai/models/manifest.json — an un-provenanced model artifact. This is the check that found 6.9GB of unregistered gemma-4 weights. Either register it (source, revision, licence) or delete it."

      - alert: AiModelVerifyStale
        expr: time() - homelab_ai_model_verify_last_run_timestamp_seconds > 8.5 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No model-weight verification in over 8.5 days"
          description: "verify-models.sh (weekly, Sun 04:00) has not completed in over a week. Weight integrity is unverified while this is stale."

      - alert: AiModelVerifyMetricsMissing
        expr: absent(homelab_ai_model_verify_last_run_timestamp_seconds)
        for: 8d
        labels:
          severity: warning
        annotations:
          summary: "Model-verify metrics absent — the check may not be running"
          description: "node-exporter is not exposing homelab_ai_model_* from its textfile collector. Either the weekly cron is gone or the textfile dir is unwritable (present-but-unwritable is the dangerous case — todos.md #11)."

  # AI audit trail (todos.md #40). Langfuse traces expire at 14 days — right for
  # debugging, wrong for traceability. The slim record in ai_governance.gateway_calls
  # keeps who/when/what-model/how-much plus content HASHES (never bodies) for 13
  # months. If the export stops, evidence is destroyed by the source TTL and is
  # unrecoverable — which is why the dead-man here matters more than most.
  - name: ai-audit
    rules:
      - alert: AiAuditExportStale
        expr: time() - homelab_ai_audit_last_run_timestamp_seconds > 36 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "AI audit export has not run in over 36h"
          description: "export-audit.sh (daily 02:30) harvests the long-lived audit record from Langfuse BEFORE its 14-day TTL deletes the source. Gaps become permanent holes in the audit trail once that window passes. See /srv/ai-data/backups/ai-audit.log."

      - alert: AiAuditExportMissing
        expr: absent(homelab_ai_audit_last_run_timestamp_seconds)
        for: 3d
        labels:
          severity: critical
        annotations:
          summary: "AI audit export metrics absent — the audit trail may be silently ending"
          description: "node-exporter is not exposing homelab_ai_audit_*. Every day this persists is a day of AI gateway activity that will be permanently unrecoverable after Langfuse's 14-day TTL. Critical because the loss is irreversible, not because the system is down."

      - alert: AiAuditUnattributedCalls
        expr: homelab_ai_audit_unattributed_recent > 50
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} gateway calls in the last 2d cannot be attributed to a system"
          description: "Calls reached LiteLLM without a resolvable user_api_key_alias, so they cannot be tied to an ai-inventory.yml entry. Either a consumer is using an unaliased key, or litellm_settings.langfuse_default_tags has regressed. Threshold is 50, not 0, because historical traces predating attribution (2026-07-22) age out over 14 days."

  # Governance eval suite (todos.md #42). The blocking cases assert SECURITY and
  # ISOLATION properties — key scoping, text2cypher guardrails, corpus isolation,
  # embedding dimension. A failure means one of those regressed, most likely via a
  # workflow or config edit that looked unrelated. Advisory (quality) cases are
  # deliberately NOT alerted: a gate that is usually red gets disabled.
  - name: ai-evals
    rules:
      - alert: AiEvalBlockingFailure
        expr: homelab_ai_eval_blocking_failures > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} BLOCKING AI eval case(s) failing — a security property regressed"
          description: "docker/ai/evals asserts properties that must always hold: a scoped key cannot reach an out-of-scope model, the text2cypher guard refuses writes and caps LIMIT, the graph webhook requires auth, the Playbook bot cannot cite example.com, embeddings are 1024-dim. One has stopped holding. Run /opt/homelab/ai/evals/run-evals.py for the failing case and its rationale. See /srv/ai-data/backups/ai-evals.log."

      - alert: AiEvalsStale
        expr: time() - homelab_ai_eval_last_run_timestamp_seconds > 36 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "AI eval suite has not run in over 36h"
          description: "The daily suite (03:10) has not completed. While stale, a guardrail could regress unnoticed — which is the exact failure mode the suite exists to prevent."

      - alert: AiEvalsMetricsMissing
        expr: absent(homelab_ai_eval_last_run_timestamp_seconds)
        for: 3d
        labels:
          severity: warning
        annotations:
          summary: "AI eval metrics absent — the suite may not be running"
          description: "node-exporter is not exposing homelab_ai_eval_*. Either the daily cron is gone or the textfile dir is unwritable (present-but-unwritable is the dangerous case — todos.md #11)."
